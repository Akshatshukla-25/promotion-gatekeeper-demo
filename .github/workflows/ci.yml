name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build succeeded"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run test
        run: |
          msg=$(git log -1 --pretty=%B)
          echo "Commit message: $msg"
          if echo "$msg" | grep -q '\[fail-ci\]'; then
            echo "CI test failed due to [fail-ci] in commit message"
            exit 1
          fi
          echo "Test passed"
