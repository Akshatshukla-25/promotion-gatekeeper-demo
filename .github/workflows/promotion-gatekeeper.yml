name: Promotion Gatekeeper
on:
  pull_request:
    branches: [uat, prod]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
concurrency:
  group: gatekeeper-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: read
  pull-requests: write
  statuses: write
jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: Akshatshukla-25/promotion-gatekeeper@v1
        with:
          environments: dev,uat,prod
          block-on-blocked: "false"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: promotion-gatekeeper-report
          path: promotion-gatekeeper-report/
          if-no-files-found: ignore
